
name: Manual Market History Backfill

on:
  workflow_dispatch:
    inputs:
      codes:
        description: "TWSE stock codes, comma separated"
        required: true
        default: "2330,2317"
        type: string
      months:
        description: "Months of history (1-12)"
        required: true
        default: "4"
        type: choice
        options:
          - "4"
          - "8"

permissions:
  contents: read

concurrency:
  group: market-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: Backfill TWSE History
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill selected stocks
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CODES: ${{ inputs.codes }}
          MONTHS: ${{ inputs.months }}
        run: |
          test -n "$DATABASE_URL" || (echo "Missing DATABASE_URL" && exit 1)
          python market_backfill.py --codes "$CODES" --months "$MONTHS"
