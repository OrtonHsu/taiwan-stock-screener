
name: Repair November 10-11 Daily Prices

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    name: Repair TWSE and TPEx November 10-11
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests 'psycopg[binary]'
      - name: Repair missing market days
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PYCODE'
          """One-time repair of 2026-11-10/11 full-market daily closing quotes."""
          import os
          import re
          import time
          from datetime import date

          import psycopg
          import requests

          DAYS = (date(2026, 11, 10), date(2026, 11, 11))
          URLS = {
              "TWSE": "https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX",
              "TPEX": "https://www.tpex.org.tw/www/zh-tw/afterTrading/otc",
          }
          MINIMUM = {"TWSE": 900, "TPEX": 700}
          HEADERS = {"User-Agent": "Mozilla/5.0", "Accept": "application/json"}


          def number(value):
              cleaned = str(value or "").replace(",", "").strip()
              try:
                  return float(cleaned)
              except ValueError:
                  return None


          def fetch(session, market, day):
              params = (
                  {"date": day.strftime("%Y%m%d"), "type": "ALLBUT0999", "response": "json"}
                  if market == "TWSE" else
                  {"date": day.strftime("%Y/%m/%d"), "type": "EW", "response": "json"}
              )
              last_error = None
              for attempt in range(1, 5):
                  try:
                      response = session.get(URLS[market], params=params, timeout=50)
                      response.raise_for_status()
                      payload = response.json()
                      if not isinstance(payload, dict) or str(payload.get("stat", "")).lower() != "ok":
                          raise ValueError(f"官方狀態異常：{str(payload.get('stat'))[:150]}")
                      return payload
                  except (requests.RequestException, ValueError) as exc:
                      last_error = exc
                      print(f"RETRY {market} {day} attempt={attempt}: {exc}", flush=True)
                      if attempt < 4:
                          time.sleep(attempt * 3)
              raise RuntimeError(f"官方下載失敗：{last_error}")


          def parse(payload, market, day):
              required = (
                  ("證券代號", "證券名稱", "收盤價", "成交股數", "成交金額")
                  if market == "TWSE" else
                  ("代號", "名稱", "收盤", "成交股數", "成交金額(元)")
              )
              tables = payload.get("tables")
              if not isinstance(tables, list):
                  raise ValueError("官方沒有 tables")
              table = None
              columns = None
              for candidate in tables:
                  if not isinstance(candidate, dict) or not isinstance(candidate.get("fields"), list):
                      continue
                  names = [re.sub(r"\s+", "", re.sub(r"<[^>]+>", "", str(f))) for f in candidate["fields"]]
                  if all(key in names for key in required):
                      table, columns = candidate, {key: names.index(key) for key in required}
                      break
              if table is None:
                  raise ValueError(f"{market} 找不到預期收盤價表格，拒絕寫入")

              if market == "TWSE":
                  title = str(table.get("title", ""))
                  match = re.search(r"(\d{2,3})年\s*(\d{1,2})月\s*(\d{1,2})日", title)
                  if not match:
                      raise ValueError(f"無法從 TWSE 表格標題驗證日期：{title[:100]}")
                  y, m, d = map(int, match.groups())
                  if date(y + 1911, m, d) != day:
                      raise ValueError(f"TWSE 回傳日期不符 {title}")

              rows = table.get("data")
              if not isinstance(rows, list):
                  raise ValueError("官方表格沒有有效的 data")
              records, seen = [], set()
              for row in rows:
                  if not isinstance(row, list):
                      continue
                  code = str(row[columns[required[0]]]).strip()
                  if not re.fullmatch(r"\d{4}", code):
                      continue
                  close = number(row[columns[required[2]]])
                  volume = number(row[columns[required[3]]])
                  amount = number(row[columns[required[4]]])
                  if close is None or volume is None or amount is None:
                      continue
                  if close <= 0 or volume <= 0 or amount < 0:
                      continue
                  if code in seen:
                      raise ValueError(f"官方同日重複代號：{code}")
                  seen.add(code)
                  records.append((day.isoformat(), market, code,
                                  str(row[columns[required[1]]]).strip() or code,
                                  close, volume, amount))

              if len(records) < MINIMUM[market]:
                  raise ValueError(f"{market} {day} 僅 {len(records)} 檔，低於安全門檻 {MINIMUM[market]}，拒絕寫入")
              return records


          def store(database_url, records):
              sql = """
                  INSERT INTO public.prices
                      (date, market, code, name, close, volume, amount)
                  VALUES (%s, %s, %s, %s, %s, %s, %s)
                  ON CONFLICT (date, market, code) DO NOTHING
              """
              with psycopg.connect(database_url) as conn:
                  with conn.cursor() as cur:
                      cur.executemany(sql, records)
                      count = cur.rowcount
                  conn.commit()
              return count


          def main():
              database_url = os.environ.get("DATABASE_URL")
              if not database_url:
                  raise RuntimeError("Missing DATABASE_URL")
              failures = []
              with requests.Session() as session:
                  session.headers.update(HEADERS)
                  for day in DAYS:
                      for market in ("TWSE", "TPEX"):
                          try:
                              records = parse(fetch(session, market, day), market, day)
                              inserted = store(database_url, records)
                              print(f"REPAIR_OK {day} {market}: valid={len(records)} inserted={inserted}", flush=True)
                          except Exception as exc:
                              failures.append(f"{day} {market}: {exc}")
                              print(f"REPAIR_FAILED {day} {market}: {exc}", flush=True)
                          time.sleep(2)
              if failures:
                  raise RuntimeError("部分補檔失敗：" + " | ".join(failures))
              print("REPAIR_ALL_OK: 2026-11-10 / 2026-11-11", flush=True)


          if __name__ == "__main__":
              main()
          PYCODE
