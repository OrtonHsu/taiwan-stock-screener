
name: Test TPEx Stock List

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-tpex:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install requests

      - name: Test TPEx stock list
        run: python tpex_stock_list.py
