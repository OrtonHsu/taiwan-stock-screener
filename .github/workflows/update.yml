
name: Update Taiwan Stock Data

on:
  workflow_dispatch:
  # On merging a reliability repair to main, perform one catch-up run.
  push:
    branches: [main]
    paths:
      - '.github/workflows/update.yml'
      - 'daily_update.py'
      - 'daily_eod_guard.py'
  # Verified historical recovery continues to run even when GitHub's EOD
  # schedule is delayed. Use successful completions as fallback wakeups.
  workflow_run:
    workflows: ["V2 TWSE Mar-Jun Auto Recovery"]
    types: [completed]
  schedule:
    - cron: '30 9 * * 1-5'   # 台灣 17:30
    - cron: '17 11 * * 1-5'  # 台灣 19:17 備援
    - cron: '37 13 * * 1-5'  # 台灣 21:37 備援


permissions:
  contents: read

concurrency:
  # Applies to schedule, dispatch, fallback and deploy catch-up.
  group: taiwan-stock-daily-verified-snapshot
  cancel-in-progress: false

jobs:
  daily_update:
    name: Update TWSE and TPEx Daily
    # Only our default-branch historical recovery is a trusted wakeup.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check complete market coverage before official fetch
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || (echo 'Missing DATABASE_URL' && exit 1)
          python daily_eod_guard.py

  history_backfill:
    name: Manual TWSE History Backfill
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill existing TWSE watchlist
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TWSE_CODES: ${{ vars.TWSE_CODES }}
        run: |
          test -n "$DATABASE_URL" || (echo 'Missing DATABASE_URL' && exit 1)
          python history.py --codes "${TWSE_CODES:-2330,2317,2454,2303,2882}" --months 8
