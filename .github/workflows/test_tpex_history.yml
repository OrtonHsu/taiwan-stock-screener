
name: Test TPEx History API

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-history:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: python -m pip install requests

      - name: Test TPEx historical data
        run: python test_tpex_history.py
