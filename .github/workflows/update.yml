
name: Update Taiwan Stock Data

on:
  workflow_dispatch:
  schedule:
    - cron: '30 9 * * 1-5'

permissions:
  contents: read

jobs:
  daily_update:
    name: Update TWSE and TPEx Daily
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch and store daily market data
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || (echo 'Missing DATABASE_URL' && exit 1)
          python daily_update.py

  history_backfill:
    name: Manual TWSE History Backfill
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Backfill existing TWSE watchlist
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TWSE_CODES: ${{ vars.TWSE_CODES }}
        run: |
          test -n "$DATABASE_URL" || (echo 'Missing DATABASE_URL' && exit 1)
          python history.py --codes "${TWSE_CODES:-2330,2317,2454,2303,2882}" --months 8
