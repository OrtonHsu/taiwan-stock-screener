
name: Write TPEx History to Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tpex-history-write
  cancel-in-progress: false

jobs:
  write-tpex:
    name: Write TPEx 1240 History
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas psycopg[binary]

      - name: Write TPEx history to Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python tpex_backfill.py \
            --codes 1240 \
            --months 2 \
            --delay 2 \
            --write
