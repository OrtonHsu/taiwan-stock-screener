
name: V1.6 Strategy Backtest

on:
  workflow_dispatch:
    inputs:
      signal_days:
        description: "Number of historical signal dates"
        required: true
        default: "5"
        type: choice
        options:
          - "5"
          - "10"
          - "20"

      top:
        description: "Max candidates per mode per signal date"
        required: true
        default: "5"
        type: choice
        options:
          - "5"
          - "10"

permissions:
  contents: read

concurrency:
  group: strategy-backtest-v16
  cancel-in-progress: false

jobs:
  backtest:
    name: Run V1.6 Backtest
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install "psycopg[binary]"

      - name: Run historical backtest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SIGNAL_DAYS: ${{ inputs.signal_days || '5' }}
          TOP: ${{ inputs.top || '5' }}

        run: |
          test -n "$DATABASE_URL" || (echo "Missing DATABASE_URL" && exit 1)
          python backtest_v16.py \
            --signal-days "$SIGNAL_DAYS" \
            --top "$TOP" \
            --output backtest_v16_results

      - name: Upload backtest CSV reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v16-backtest-results
          path: backtest_v16_results/*.csv
          if-no-files-found: warn
          retention-days: 30
