name: V2 TPEx 7713 Guarded Repair Assessment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v2-tpex-7713-guarded-assessment
  cancel-in-progress: false

jobs:
  assess:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Assess exact 7713 insert candidates (never writes)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          test -n "$DATABASE_URL" || (echo 'Missing DATABASE_URL' && exit 1)
          python tpex_7713_guarded_repair.py
